<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; height: 100%; }
  body { display: flex; flex-direction: column; font-family: sans-serif; }
  #stage { flex: 1 1 auto; min-height: 0; }
  svg { width: 100%; height: 100%; display: block; }
  #label {
    flex: 0 0 auto; text-align: center; color: #fff; font-weight: 700; font-size: 13px;
    min-height: 18px; padding: 0 4px 4px; direction: rtl; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .skin { fill: #e2ab82; stroke: #a8714a; stroke-width: 1.2; }
  .eye { fill: #2b2420; }
  .face { stroke: #2b2420; stroke-width: 2.2; stroke-linecap: round; opacity: .75; fill: none; }
  .mover, .f1, .f2 { transform-origin: 0 0; transition: transform var(--t, .14s) ease-in-out; }
</style>
<script src="signs.js"></script>
</head>
<body>
<div id="stage"></div>
<div id="label">…</div>
<script>
// بيانات الإشارات في signs.js. شكل الإطار: { R: يد, L: يد (اختياري), face: {brow, mouth} (اختياري) }
// اليد: { f: [إبهام, سبابة, وسطى, بنصر, خنصر] بين 0 (ممدود) و1 (مثني), r: دوران, x, y: موضع }
const D = window.SIGNS;
const rest = D.rest;
const NEUTRAL_FACE = { brow: 0, mouth: 0.8 };

let leftHanded = false;
try { leftHanded = localStorage.getItem("lh") === "1"; } catch (e) {}
// سرعة العرض: 1× أو 1.5× أو 2×
const SPEEDS = [1, 1.5, 2];
let speed = 1;
try { const v = Number(localStorage.getItem("spd")); if (SPEEDS.includes(v)) speed = v; } catch (e) {}
const applySpeed = () => document.documentElement.style.setProperty("--t", Math.max(0.07, 0.14 / speed) + "s");
applySpeed();

// ---------- الأفاتار ----------
const NS = "http://www.w3.org/2000/svg";
const el = (n, a = {}, p) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
const FINGERS = [
  {dx:-17,dy:6,len:[14,12],base:-35},{dx:-9,dy:-12,len:[18,14],base:0},{dx:-1,dy:-14,len:[20,15],base:0},
  {dx:7,dy:-12,len:[18,14],base:0},{dx:14,dy:-8,len:[14,11],base:5}
];
function makeHand(parent, mirror) {
  const mover = el("g", { class: "mover" }, el("g", {}, parent));
  const flip = el("g", { transform: mirror ? "scale(-1,1)" : "" }, mover);
  el("rect", { x:-20, y:-12, width:40, height:40, rx:14, class:"skin" }, flip);
  const fingers = FINGERS.map((f) => {
    const g1 = el("g", { class: "f1" }, flip);
    el("rect", { x:-3.5, y:-f.len[0], width:7, height:f.len[0], rx:3.5, class:"skin" }, g1);
    const g2 = el("g", { class: "f2" }, g1);
    el("rect", { x:-3.2, y:-f.len[1], width:6.4, height:f.len[1], rx:3.2, class:"skin" }, g2);
    return { g1, g2, base: f.base };
  });
  return { mover, fingers, mirror };
}
function setPose(h, p, ox) {
  const s = h.mirror ? -1 : 1;
  h.mover.style.transform = `translate(${ox + p.x * s}px, ${90 + p.y}px) rotate(${p.r * s}deg)`;
  h.fingers.forEach((fg, i) => {
    const c = p.f[i];
    fg.g1.style.transform = `translate(${FINGERS[i].dx}px, ${FINGERS[i].dy}px) rotate(${fg.base + c * 70}deg)`;
    fg.g2.style.transform = `translate(0px, ${-FINGERS[i].len[0]}px) rotate(${c * 85}deg)`;
  });
}
const svg = el("svg", { viewBox: "0 0 240 185", preserveAspectRatio: "xMidYMid meet" }, document.getElementById("stage"));
const head = el("g", {}, svg);
el("ellipse", { cx:120, cy:52, rx:36, ry:42, class:"skin" }, head);
el("circle", { cx:107, cy:46, r:3.5, class:"eye" }, head);
el("circle", { cx:133, cy:46, r:3.5, class:"eye" }, head);
const mouthEl = el("path", { class:"face" }, head);
const browEl = el("path", { class:"face" }, head);
function setFace(f) {
  const b = (f && typeof f.brow === "number") ? f.brow : NEUTRAL_FACE.brow;   // -1 منخفض .. 1 مرفوع
  const m = (f && typeof f.mouth === "number") ? f.mouth : NEUTRAL_FACE.mouth; // -1 عابس .. 1 مبتسم
  browEl.setAttribute("d", `M100 ${34 - b * 8} Q120 ${22 - b * 10} 140 ${34 - b * 8}`);
  mouthEl.setAttribute("d", `M108 68 Q120 ${68 + m * 10} 132 68`);
}
const layer = el("g", {}, svg);
const handL = makeHand(layer, true), handR = makeHand(layer, false);

// اليد الأساسية تظهر يميناً، أو يساراً لمن يفضّل ذلك
function show(fr) {
  const dom = fr.R || rest, sub = fr.L || rest;
  const right = leftHanded ? sub : dom;
  const left = leftHanded ? dom : sub;
  setPose(handR, right, 160);
  setPose(handL, left, 80);
  setFace(fr.face);
}
const toRest = () => show({ R: rest, L: rest });
toRest();

// ---------- التحويل والتشغيل ----------
const labelEl = document.getElementById("label");
const normAr = (t) => t.replace(/[ً-ٰٟـ]/g, "")
  .replace(/[أإآ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه").replace(/[ؤئ]/g, "ء");

function toFrames(text) {
  const out = [];
  for (const raw of text.split(/\s+/).filter(Boolean)) {
    if (/[؀-ۿ]/.test(raw)) {
      const w = normAr(raw).replace(/[^ء-ي]/g, "");
      if (!w) continue;
      const word = D.words.ar[w];
      if (word) word.forEach((f) => out.push({ ...f, label: raw, ms: f.ms || 600 }));
      else for (const ch of w) { const l = D.letters.ar[ch]; if (l) out.push({ ...l, label: raw + " · " + ch, ms: l.ms || 400 }); }
    } else {
      const w = raw.toLowerCase().replace(/[^a-z]/g, "");
      if (!w) continue;
      const word = D.words.en[w];
      if (word) word.forEach((f) => out.push({ ...f, label: raw, ms: f.ms || 600 }));
      else for (const ch of w) { const l = D.letters.en[ch]; if (l) out.push({ ...l, label: raw + " · " + ch.toUpperCase(), ms: l.ms || 400 }); }
    }
    out.push({ R: rest, label: raw, ms: 250 });
  }
  return out;
}

let queue = [], playing = false;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

async function play() {
  if (playing) return;
  playing = true;
  while (queue.length) {
    // إن تراكمت الإطارات نسرّع حتى لا يتأخر الأفاتار عن الفيديو
    if (queue.length > 80) queue.splice(0, queue.length - 80);
    const k = (queue.length > 40 ? 0.35 : queue.length > 25 ? 0.5 : queue.length > 12 ? 0.7 : 1) / speed;
    const fr = queue.shift();
    show(fr);
    labelEl.textContent = fr.label;
    await sleep(fr.ms * k);
  }
  toRest();
  playing = false;
}

window.onCaption = (text) => { queue.push(...toFrames(String(text))); play(); };
window.onHint = (text) => { if (!playing) labelEl.textContent = String(text); };
window.toggleSpeed = () => {
  speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length];
  try { localStorage.setItem("spd", String(speed)); } catch (e) {}
  applySpeed();
  labelEl.textContent = "×" + speed;
};
window.toggleHand = () => {
  leftHanded = !leftHanded;
  try { localStorage.setItem("lh", leftHanded ? "1" : "0"); } catch (e) {}
  toRest();
  labelEl.textContent = leftHanded ? "◀ يسار" : "يمين ▶";
};
</script>
</body>
</html>
