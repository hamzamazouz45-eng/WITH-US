name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      # إصدار واحد ثابت اسمه latest: نحرّك وسمه إلى آخر commit ثم نحدّث ملفه
      - name: Move the latest tag
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Publish the single release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "وصلة-WITHUS (آخر إصدار | latest)"
          make_latest: true
          overwrite_files: true
          files: app/build/outputs/apk/debug/app-debug.apk

      # حذف كل الإصدارات القديمة والوسوم الخاصة بها، والإبقاء على latest فقط
      - name: Delete old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName --jq '.[].tagName' \
            | grep -v '^latest$' \
            | while read -r tag; do gh release delete "$tag" --cleanup-tag --yes; done || true
